# /etc/fail2ban/filter.d/frere-flow-auth.conf
# Lignes JSON du journal Caddy : réponse 401 (identifiants faux) ou 429 (trop d'essais) sur la connexion.
# client_ip = vraie adresse du visiteur (Caddy la lit dans CF-Connecting-IP derrière Cloudflare).
[Definition]
failregex = ^.*"client_ip":"<HOST>".*"uri":"/api/auth/(?:login|verifier)[^"]*".*"status":(?:401|429)
ignoreregex =
datepattern = "ts":{EPOCH}
