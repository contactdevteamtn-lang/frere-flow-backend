# /etc/mongod.conf — UNIQUEMENT si MongoDB est installé sur le VPS (au lieu d'Atlas).
# MongoDB n'écoute que sur la machine elle-même et exige une authentification.
storage:
  dbPath: /var/lib/mongodb
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
net:
  port: 27017
  bindIp: 127.0.0.1        # jamais 0.0.0.0 : aucun accès depuis Internet
security:
  authorization: enabled   # aucun accès sans utilisateur / mot de passe
# Transactions (utilisées par l'application) : MongoDB doit tourner en replica set, même à 1 nœud.
# Après le 1er démarrage : mongosh --eval 'rs.initiate()'
replication:
  replSetName: rs0
