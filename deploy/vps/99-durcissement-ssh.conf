# /etc/ssh/sshd_config.d/99-durcissement.conf — SSH par clé uniquement, jamais root.
# ⚠ À installer SEULEMENT après avoir vérifié que la connexion par clé de l'utilisateur sudo fonctionne
#   (voir SECURITE-VPS.md, étape 2) — sinon risque de se bloquer dehors.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
# Remplacez « deploy » par le nom de votre utilisateur sudo
AllowUsers deploy
